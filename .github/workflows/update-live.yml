name: update-live

on:
  schedule:
    # UTC 时间；对应北京时间 0/3/6/9/12/15/18/21 点整
    - cron: "0 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取天气 + 新闻
        run: python3 scripts/fetch_live.py
      - name: 提交
        run: |
          git config user.name "kindle-bot"
          git config user.email "kindle-bot@users.noreply.github.com"
          git add data/live.json
          git diff --staged --quiet || git commit -m "chore: update live data"
          git push

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>信息屏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#ffffff;color:#000000;
font-family:"Helvetica Neue",Helvetica,Arial,"Heiti SC","STHeiti","Microsoft YaHei",sans-serif;
-webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-user-select:none;user-select:none}

/* 内容区：宽 1072（Kindle 竖屏视口宽），高 1172（= 实测视口 1268 - 底部 tabbar 96）。
   由 JS 按可用高度等比缩放，始终完整落在 tabbar 上方。 */
#page{position:absolute;top:0;left:0;width:1072px;height:1172px;
transform-origin:0 0;-webkit-transform-origin:0 0}

.screen{width:1072px;height:1172px;display:none;position:relative}
.screen.on{display:block}
#scr-panel,#scr-news{overflow-y:auto}

/* ---------- 屏幕1：全屏时钟（时钟+日期组整体垂直居中） ---------- */
.wx{position:absolute;top:84px;right:44px;text-align:right;font-size:32px;line-height:1.65}
.wx-city{font-size:30px}
.clock-big{position:absolute;top:50%;left:0;width:1072px;margin-top:-230px;text-align:center;font-size:360px;line-height:1}
.date-big{position:absolute;top:50%;left:0;width:1072px;margin-top:185px;text-align:center;font-size:44px;letter-spacing:8px}

/* ---------- 屏幕2：面板（上：左日历右时钟；下：待办） ---------- */
.panel-top{height:490px}
.cal{float:left;width:620px;height:490px;padding:32px 40px}
.clock-mid{float:right;width:452px;height:490px;text-align:center}
.clock-mid .cm{font-size:150px;line-height:1;margin-top:120px}
.clock-mid .dm{font-size:34px;letter-spacing:4px;margin-top:20px}
.todo{clear:both;height:682px;border-top:3px solid #000000;padding:22px 40px}
.box-title{font-size:28px;letter-spacing:12px;margin-bottom:20px}
.cal-item{font-size:32px;line-height:1.75}
.cal-item .t{display:inline-block;width:270px}
.todo-item{font-size:32px;line-height:1.8}
.todo-item .box{font-weight:bold;padding-right:10px}
.todo-item .due{color:#555555;font-size:28px}
.t-empty{font-size:30px;color:#666666;line-height:1.8}

/* ---------- 屏幕3：新闻 ---------- */
.news-head{font-size:30px;letter-spacing:4px;padding:30px 40px 16px;border-bottom:3px solid #000000}
.news-head .nm{float:right;font-size:24px;color:#555555;letter-spacing:0}
.news-item{padding:20px 40px;border-bottom:1px solid #bbbbbb}
.ni-title{font-size:34px;line-height:1.45}
.ni-meta{font-size:22px;color:#555555;margin-top:10px}
.ni-sum{font-size:26px;line-height:1.6;color:#111111;margin-top:10px}

/* ---------- 底部切换：钉在浏览器视口最底部，与页面高度无关 ---------- */
#tabbar{position:fixed;left:0;bottom:0;width:100%;height:96px;border-top:3px solid #000000;background:#ffffff}
.tab{float:left;width:33.33%;height:96px;line-height:96px;text-align:center;font-size:38px;letter-spacing:8px;text-indent:8px}
.tab.on{background:#000000;color:#ffffff}

/* ---------- 临时校准行（数值确认后删除） ---------- */
.debug{position:absolute;left:0;bottom:12px;width:1072px;text-align:center;font-size:20px;color:#999999}
</style>
</head>
<body>

<div id="page">

<div id="scr-clock" class="screen">
  <div class="wx" id="wx"></div>
  <div class="clock-big" id="clock-big">--:--</div>
  <div class="date-big" id="date-big"></div>
  <div class="debug" id="debug"></div>
</div>

<div id="scr-panel" class="screen on">
  <div class="panel-top">
    <div class="cal">
      <div class="box-title">日程</div>
      <div id="cal-list"></div>
    </div>
    <div class="clock-mid">
      <div class="cm" id="clock-mid">--:--</div>
      <div class="dm" id="date-mid"></div>
    </div>
  </div>
  <div class="todo">
    <div class="box-title">待办</div>
    <div id="todo-list"></div>
  </div>
</div>

<div id="scr-news" class="screen">
  <div class="news-head">AIHOT · 精选<span class="nm" id="news-meta"></span></div>
  <div id="news-list"></div>
</div>

</div>

<div id="tabbar">
  <div class="tab" id="tab-clock">时钟</div>
  <div class="tab on" id="tab-panel">面板</div>
  <div class="tab" id="tab-news">新闻</div>
</div>

<script>
(function(){
function $(i){return document.getElementById(i);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var WK=['一','二','三','四','五','六','日'];
function pad(n){return (n<10?'0':'')+n;}
function hm(d){return pad(d.getHours())+':'+pad(d.getMinutes());}
function cdate(d){return (d.getMonth()+1)+'月'+d.getDate()+'日 星期'+WK[d.getDay()==0?6:d.getDay()-1];}

/* 时钟：只到分，分钟不变不动 DOM */
var last='';
function tick(){var s=hm(new Date());if(s!==last){last=s;$('clock-big').innerHTML=s;$('clock-mid').innerHTML=s;}}
tick();setInterval(tick,1000);
var now=new Date();
$('date-big').innerHTML=cdate(now);
$('date-mid').innerHTML=cdate(now);

/* 整点重载：0/3/6/9/12/15/18/21 点 */
function nextRefresh(){
  var d=new Date();
  var nh=(Math.floor(d.getHours()/3)+1)*3;
  var t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),nh,0,0,0);
  var ms=t.getTime()-d.getTime();
  if(ms<1000){ms=1000;}
  if(ms>86400000){ms=86400000;}
  return {ms:ms,label:pad(t.getHours())+':'+pad(t.getMinutes())};
}
var nr=nextRefresh();
setTimeout(function(){location.reload(true);},nr.ms);

/* 屏幕切换，记住上次看的 */
var TABS=['clock','panel','news'];
function show(name){
  for(var i=0;i<TABS.length;i++){
    var t=TABS[i];
    $('scr-'+t).className=(t===name)?'screen on':'screen';
    $('tab-'+t).className=(t===name)?'tab on':'tab';
  }
  try{localStorage.setItem('ks-tab',name);}catch(e){}
}
var saved=null,ok=false;
try{saved=localStorage.getItem('ks-tab');}catch(e2){}
if(saved){for(var i=0;i<TABS.length;i++){if(TABS[i]===saved){ok=true;}}}
show(ok?saved:'panel');
$('tab-clock').onclick=function(){show('clock');};
$('tab-panel').onclick=function(){show('panel');};
$('tab-news').onclick=function(){show('news');};

/* 数据读取：兼容明文 JSON 和 base64 两种格式 */
function load(url,cb){
  var x=new XMLHttpRequest();
  x.open('GET',url+'?_='+Date.now(),true);
  x.onreadystatechange=function(){
    if(x.readyState!==4){return;}
    if(x.status===200){cb(x.responseText);}else{cb(null);}
  };
  x.send(null);
}
function parse(text){
  if(!text){return null;}
  try{return JSON.parse(text);}catch(e){}
  try{
    var raw=String(text).replace(/\s/g,'');
    var bytes=atob(raw);
    var arr=[],i;
    for(i=0;i<bytes.length;i++){arr.push(bytes.charCodeAt(i));}
    return JSON.parse(decodeURIComponent(escape(String.fromCharCode.apply(null,arr))));
  }catch(e2){return null;}
}

function renderLive(d){
  if(!d){
    $('wx').innerHTML='<div class="wx-city">天气数据未就绪</div>';
    $('news-list').innerHTML='<div class="t-empty" style="padding:40px 40px">live.json 未就绪，等下一次整点抓取</div>';
    return;
  }
  var w=d.weather||{};
  if(w.city){
    $('wx').innerHTML='<div class="wx-city">'+esc(w.city)+' '+esc(w.desc)+'</div>'+
      '<div>'+esc(w.temp)+'°（今日 '+esc(w.lo)+'°~'+esc(w.hi)+'°）</div>';
  }
  var news=d.news||[],h='',i;
  for(i=0;i<news.length;i++){
    var n=news[i];
    h+='<div class="news-item"><div class="ni-title">'+esc(n.title)+'</div>'+
       '<div class="ni-meta">'+esc(n.category||'')+(n.source?(' · '+esc(n.source)):'')+(n.pub?(' · '+esc(n.pub)):'')+'</div>'+
       (n.summary?('<div class="ni-sum">'+esc(n.summary)+'</div>'):'')+'</div>';
  }
  $('news-list').innerHTML=h||'<div class="t-empty" style="padding:40px 40px">暂无条目</div>';
  $('news-meta').innerHTML='更新于 '+(d.generated_at||'--')+' · 下次 '+nr.label;
}

function renderLocal(d){
  var ev=(d&&d.events)||[],td=(d&&d.todos)||[],h='',t='',i;
  for(i=0;i<ev.length;i++){
    h+='<div class="cal-item"><span class="t">'+esc(ev[i].label||'')+'</span>'+esc(ev[i].title||'')+'</div>';
  }
  $('cal-list').innerHTML=h||'<div class="t-empty">接下来没有日程</div>';
  for(i=0;i<td.length;i++){
    t+='<div class="todo-item"><span class="box">□ </span>'+esc(td[i].title||'')+
       (td[i].due?(' <span class="due">'+esc(td[i].due)+'</span>'):'')+'</div>';
  }
  $('todo-list').innerHTML=t||'<div class="t-empty">待办是空的</div>';
}

load('data/live.json',function(txt){renderLive(parse(txt));});
load('data/local.json',function(txt){renderLocal(parse(txt));});

/* ---------- 自适应缩放 ----------
   底部 tabbar 是 position:fixed，永远钉在视口最底部（与页面高度无关，这是需求）；
   内容区（#page，1072x1172）只需缩放塞进 tabbar 上方的可用区域：
   可用高 = min(实测视口高, 1268) - 96。1268 是 Kindle 浏览器实测视口高
   （屏幕 1448 减去顶部功能条约 180px）；即便 JS 测到全屏高 1448，
   封顶值也保证不出错。改动生效才写样式，避免墨水屏反复闪。 */
var PW=1072,PH=1172,TAB=96,VH_CAP=1268;
function measure(){
  var w=1e9,h=1e9,v;
  v=window.innerWidth;if(v>0&&v<w){w=v;}
  v=document.documentElement.clientWidth;if(v>0&&v<w){w=v;}
  v=document.body?document.body.clientWidth:0;if(v>0&&v<w){w=v;}
  v=window.innerHeight;if(v>0&&v<h){h=v;}
  v=document.documentElement.clientHeight;if(v>0&&v<h){h=v;}
  v=document.body?document.body.clientHeight:0;if(v>0&&v<h){h=v;}
  if(w>1e8){w=PW;}
  if(h>1e8){h=VH_CAP;}
  return {w:w,h:h};
}
function fit(){
  var m=measure();
  var avail=Math.max(600,Math.min(m.h,VH_CAP)-TAB);
  var s=Math.min(m.w/PW,avail/PH);
  var x=(m.w-PW*s)/2;
  var t='translate('+x+'px,0px) scale('+s+')';
  var p=document.getElementById('page');
  if(p._t!==t){p._t=t;p.style.webkitTransform=t;p.style.transform=t;}
  var d='视口 '+m.w+'×'+m.h+' · 内容 '+PW+'×'+PH+' 缩放 '+s.toFixed(3);
  if(p._d!==d){p._d=d;$('debug').innerHTML=d;}
}
fit();
setTimeout(fit,300);
setTimeout(fit,1000);
setInterval(fit,5000);
window.onresize=fit;
if('onorientationchange' in window){window.onorientationchange=fit;}
})();
</script>
</body>
</html>
